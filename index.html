<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GKPI Digital Library</title>
  <!-- Tailwind CSS untuk "Mengecat" Bangunan -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Penghubung ke Gudang Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- PDF.js untuk Ruang Baca Anti-Bocor -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans select-none" oncontextmenu="return false;">

  <!-- 1. PINTU MASUK (Halaman Login / Daftar) -->
  <div id="auth-view" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
      <h1 class="text-3xl font-bold text-blue-700 mb-2">Suara GKPI</h1>
      <p class="text-gray-500 mb-6">Perpustakaan Digital</p>
      <form id="auth-form" class="space-y-4">
        <input type="email" id="email" placeholder="Email Anda" class="w-full px-4 py-2 border rounded-lg outline-none" required>
        <input type="password" id="password" placeholder="Kata Sandi (Min 6 Karakter)" class="w-full px-4 py-2 border rounded-lg outline-none" required minlength="6">
        <div class="flex gap-2">
          <button type="submit" id="btn-login" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700">Masuk</button>
          <button type="button" id="btn-register" class="flex-1 bg-gray-200 text-gray-700 font-bold py-2 rounded-lg hover:bg-gray-300">Daftar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. RUANG UTAMA (Aplikasi Setelah Login) -->
  <div id="main-layout" class="hidden h-screen flex-col">
    <header class="bg-blue-700 text-white p-4 shadow-md text-center font-bold text-lg" id="app-header">
      Katalog Buku
    </header>

    <!-- Area Rak Buku -->
    <main class="flex-1 overflow-y-auto p-4 pb-20">
      <div id="view-library" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
      <div id="view-mybooks" class="hidden grid grid-cols-2 md:grid-cols-4 gap-4"></div>
      
      <div id="view-profile" class="hidden flex flex-col items-center pt-8">
        <h2 id="profile-email" class="text-xl font-bold mb-6">email@jemaat.com</h2>
        <button id="btn-logout" class="bg-red-500 text-white px-8 py-2 rounded-lg font-bold">Keluar</button>
      </div>
    </main>

    <!-- Navigasi Bawah (Menu) -->
    <nav class="bg-white border-t fixed bottom-0 w-full flex justify-around p-3 text-sm text-gray-500 z-20">
      <button id="nav-library" class="flex flex-col items-center text-blue-600 font-bold">📚 Beranda</button>
      <button id="nav-mybooks" class="flex flex-col items-center hover:text-blue-600">📖 Buku Saya</button>
      <button id="nav-profile" class="flex flex-col items-center hover:text-blue-600">👤 Profil</button>
    </nav>
  </div>

  <!-- 3. KASIR QRIS (Tersembunyi, muncul saat beli) -->
  <div id="payment-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl p-6 w-full max-w-sm text-center">
      <h3 class="font-bold text-xl mb-1">Pembayaran QRIS</h3>
      <p id="payment-itemName" class="text-sm text-gray-600 mb-1">Judul Buku</p>
      <p id="payment-itemPrice" class="text-lg font-bold text-blue-600 mb-4">Rp 0</p>
      
      <!-- Nanti sistem Midtrans/Tripay akan menaruh QRIS asli di kotak ini -->
      <div class="w-48 h-48 bg-gray-200 border-2 border-dashed mx-auto mb-4 flex items-center justify-center text-sm font-bold text-gray-400">
        [ AREA QRIS ]
      </div>
      
      <button id="btn-confirm-payment" class="bg-green-600 w-full text-white font-bold py-2 rounded-lg mb-2">Simulasi: Bayar Berhasil</button>
      <button id="btn-cancel-payment" class="w-full text-gray-500 font-bold py-2">Batal</button>
    </div>
  </div>

  <!-- 4. RUANG BACA ANTI-BOCOR (Tersembunyi) -->
  <div id="reader-view" class="fixed inset-0 bg-gray-900 hidden flex-col z-50">
    <header class="bg-gray-800 text-white p-3 flex justify-between items-center z-20">
      <button id="btn-close-reader" class="bg-red-500 px-4 py-1 rounded font-bold">Tutup</button>
      <span id="page-info" class="text-sm">Hal - / -</span>
      <div class="flex gap-2">
        <button id="btn-prev" class="bg-gray-700 px-3 py-1 rounded">&lt;</button>
        <button id="btn-next" class="bg-gray-700 px-3 py-1 rounded">&gt;</button>
      </div>
    </header>
    <div class="flex-1 overflow-auto relative flex items-start justify-center p-4 bg-gray-900" id="canvas-container">
      <canvas id="pdf-canvas" class="bg-white max-w-full"></canvas>
      <div id="watermark" class="absolute inset-0 pointer-events-none opacity-20 flex flex-wrap items-center justify-center text-white text-3xl font-bold -rotate-45 z-10 break-all leading-loose"></div>
    </div>
  </div>

  <!-- Pemasangan Listrik/Logika -->
  <script src="app.js"></script>
</body>
</html>
