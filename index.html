<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GKPI Digital Library</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans select-none" oncontextmenu="return false;">

  <!-- Auth View -->
  <div id="auth-view" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Logo_GKPI.png" alt="Logo GKPI" class="h-20 mx-auto mb-4 object-contain">
      <h1 class="text-2xl font-bold text-blue-700 mb-6">GKPI Digital Library</h1>
      <form id="auth-form" class="space-y-4">
        <input type="email" id="email" placeholder="Email Anda" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        <input type="password" id="password" placeholder="Kata Sandi" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        <div class="flex gap-2">
          <button type="submit" id="btn-login" class="flex-1 bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700">Masuk</button>
          <button type="button" id="btn-register" class="flex-1 bg-gray-200 text-gray-700 font-semibold py-2 rounded-lg hover:bg-gray-300">Daftar</button>
        </div>
        <p id="auth-msg" class="text-sm text-red-500 mt-2 hidden"></p>
      </form>
    </div>
  </div>

  <!-- Dashboard View -->
  <div id="dashboard-view" class="min-h-screen hidden">
    <header class="bg-blue-700 text-white p-4 shadow-md flex justify-between items-center">
      <h1 class="text-lg font-bold">GKPI Digital</h1>
      <button id="btn-logout" class="text-sm bg-red-500 px-3 py-1 rounded hover:bg-red-600">Keluar</button>
    </header>
    <main class="p-4 max-w-2xl mx-auto mt-6">
      <div class="bg-white rounded-xl shadow-md p-5 flex flex-col md:flex-row gap-4 items-center">
        <div class="w-32 h-40 bg-gray-200 rounded flex items-center justify-center text-gray-400 font-bold border-2 border-dashed">
          Suara GKPI<br>Edisi Nov
        </div>
        <div class="flex-1 text-center md:text-left">
          <h2 class="text-xl font-bold mb-1">Suara GKPI - November 2026</h2>
          <p class="text-sm text-gray-500 mb-4">Terbit: 10 November 2026</p>
          <p class="text-lg font-bold text-green-600 mb-4">Rp 10.000</p>
          <button id="btn-action" class="bg-blue-600 w-full md:w-auto text-white px-6 py-2 rounded-lg font-semibold shadow hover:bg-blue-700">
            Beli Edisi Ini
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Payment Modal -->
  <div id="payment-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl p-6 w-full max-w-sm text-center">
      <h3 class="font-bold text-lg mb-2">Pembayaran QRIS</h3>
      <p class="text-sm text-gray-600 mb-4">Scan QRIS di bawah menggunakan BRImo / E-Wallet Anda.</p>
      <div class="w-48 h-48 bg-gray-200 mx-auto mb-4 flex items-center justify-center text-sm font-mono border">
        [ Gambar QRIS ]
      </div>
      <button id="btn-confirm-payment" class="bg-green-600 w-full text-white font-bold py-2 rounded mb-2">Simulasi: Bayar Berhasil</button>
      <button id="btn-cancel-payment" class="text-gray-500 text-sm hover:underline">Batal</button>
    </div>
  </div>

  <!-- PDF Reader View -->
  <div id="reader-view" class="fixed inset-0 bg-gray-900 hidden flex-col z-50">
    <header class="bg-gray-800 text-white p-3 flex justify-between items-center shadow-lg relative z-20">
      <button id="btn-close-reader" class="bg-red-500 px-3 py-1 rounded text-sm">Tutup</button>
      <span id="page-info" class="text-sm font-mono">Halaman - / -</span>
      <div class="flex gap-2">
        <button id="btn-prev" class="bg-gray-700 px-3 py-1 rounded text-sm disabled:opacity-50">&lt;</button>
        <button id="btn-next" class="bg-gray-700 px-3 py-1 rounded text-sm disabled:opacity-50">&gt;</button>
      </div>
    </header>
    <div class="flex-1 overflow-auto relative flex items-start justify-center p-4" id="canvas-container">
      <canvas id="pdf-canvas" class="shadow-2xl rounded max-w-full"></canvas>
      <!-- Watermark Dinamis -->
      <div id="watermark" class="absolute inset-0 pointer-events-none opacity-20 flex flex-wrap items-center justify-center text-white text-2xl font-bold -rotate-45 overflow-hidden z-10 break-all leading-loose">
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
